name: Documentation freshness check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, dev]
  # Run on the merge queue's temp refs so the required check-docs check gates
  # queued PRs (the queue blocks forever on a required check that never runs).
  merge_group:

jobs:
  check-docs:
    if: github.repository == 'blwfish/kicad-mcp'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e .

      - name: Verify tool count is in sync
        run: |
          python scripts/sync_tool_count.py
          if ! git diff --exit-code; then
            echo ""
            echo "::error::Tool count in docs is out of sync with the server."
            echo "Run 'python scripts/sync_tool_count.py' locally and commit the result."
            exit 1
          fi

      - name: Verify agent-notes critical-rules docs are in sync
        run: |
          python scripts/sync_agent_notes_docs.py
          if ! git diff --exit-code; then
            echo ""
            echo "::error::Mandatory/Critical Rules sections are out of sync with usage_guidance.NOTES."
            echo "Run 'python scripts/sync_agent_notes_docs.py' locally and commit the result."
            exit 1
          fi
