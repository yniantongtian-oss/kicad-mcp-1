name: Tests

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, upgrade/reliability-20261011]
  # Run on the merge queue's temp refs so this workflow's required checks
  # (pytest, check-mypy) gate queued PRs — without this the queue would wait
  # forever for a check that never runs.
  merge_group:

permissions:
  contents: read

jobs:
  # Matrix job — produces check names "pytest (3.10)" etc.  These are NOT
  # what branch protection requires (it requires a single check named
  # exactly "pytest"); the umbrella job below provides that.
  matrix:
    if: (github.repository == 'blwfish/kicad-mcp' || github.repository == 'yniantongtian-oss/kicad-mcp-1')
    name: pytest (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install KiCad symbol libraries
        # 13 tests load symbols (Device:R, etc.) via kicad-sch-api, which
        # looks up symbol files at /usr/share/kicad/symbols. Without these
        # the tests fail with "Symbol 'Device:R' not found in KiCAD
        # libraries". Locally the user has full KiCad installed; CI
        # only needs the symbol library package.
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends kicad-symbols

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package + dev deps (from lockfile)
        run: uv sync --frozen --group dev

      - name: Run tests
        env:
          KICAD_SYMBOL_DIR: /usr/share/kicad/symbols
        run: uv run python -m pytest tests/ -q

  # Umbrella job — single check named "pytest" that branch protection can
  # require regardless of how the matrix above changes shape.  Adding or
  # removing a Python version updates this PR alone; branch protection
  # never has to be re-edited.
  pytest:
    name: pytest
    needs: matrix
    if: ${{ always() && (github.repository == 'blwfish/kicad-mcp' || github.repository == 'yniantongtian-oss/kicad-mcp-1') }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify all matrix jobs passed
        run: |
          if [[ "${{ needs.matrix.result }}" == "success" ]]; then
            echo "All matrix jobs passed."
            exit 0
          fi
          echo "Matrix result: ${{ needs.matrix.result }}"
          exit 1

  mypy:
    if: (github.repository == 'blwfish/kicad-mcp' || github.repository == 'yniantongtian-oss/kicad-mcp-1')
    name: check-mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          python-version: "3.10"

      - name: Install package + dev deps (from lockfile)
        run: uv sync --frozen --group dev

      - name: Run mypy
        run: uv run mypy src/kicad_mcp/
